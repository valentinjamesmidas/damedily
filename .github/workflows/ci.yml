name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Typecheck, lint, unit testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bez --with-deps. To tahá aptem fonty a při výpadku zrcadel Ubuntu job spadne dřív, než testy začnou.
      # Sdílené knihovny Chromia na ubuntu-latest už jsou. Samotný prohlížeč se stáhne z CDN Playwright.
      - run: npx playwright install chromium
      - run: npm run test:e2e

  rls:
    name: RLS a API testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: npm ci
      - run: supabase start
      - run: supabase test db
      - name: API testy proti lokálnímu PostgREST a Auth
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          # shellcheck disable=SC1090
          source "$RUNNER_TEMP/supabase.env"
          set +a
          npm run test:rls-api

  xai-live:
    name: Živý smoke test xAI
    runs-on: ubuntu-latest
    steps:
      - name: Zjistit, jestli je nastavený secret XAI_API_KEY
        id: gate
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Secret XAI_API_KEY není nastavený, živý smoke test se nespouští."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      - name: npm run test:live
        if: steps.gate.outputs.enabled == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: npm run test:live
