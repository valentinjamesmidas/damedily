name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Typecheck, lint, unit testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  rls:
    name: RLS a API testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: npm ci
      - run: supabase start
      - run: supabase test db
      - name: API testy proti lokálnímu PostgREST a Auth
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          # shellcheck disable=SC1090
          source "$RUNNER_TEMP/supabase.env"
          set +a
          npm run test:rls-api
