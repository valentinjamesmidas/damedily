<!-- Syntetický JSON-LD podle schema.org. Není to snímek z tržiště. -->
<!doctype html>
<html lang="en">
  <head>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "item": {
              "@type": "Product",
              "name": "Front brake disc",
              "description": "Used OEM disc, light wear.",
              "sku": "1K0615301",
              "image": "https://cdn.example/disc.jpg",
              "category": "Brakes",
              "offers": {
                "@type": "Offer",
                "price": "40.00",
                "priceCurrency": "EUR",
                "itemCondition": "https://schema.org/UsedCondition"
              }
            }
          }
        ]
      }
    </script>
  </head>
</html>
